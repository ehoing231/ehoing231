<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Số Nguyên Tố</title>
    <style>
        /* Phần CSS để làm đẹp cho trang web */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.6;
        }
        .input-group {
            margin: 20px 0;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #3498db;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
        .result.prime {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.not-prime {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Kiểm Tra Số Nguyên Tố</h1>
        <p>Nhập một số để kiểm tra xem nó có phải là số nguyên tố hay không.</p>
        
        <div class="input-group">
            <input type="number" id="numberInput" placeholder="Nhập số cần kiểm tra" min="2">
        </div>
        
        <button class="btn" onclick="checkPrime()">Kiểm Tra</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        function kiem_tra_so_nguyen_to(n) {
            if (n <= 1) {
                return false;
            }
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    return false;
                }
            }
            return true;
        }

        function checkPrime() {
            const input = document.getElementById('numberInput').value;
            const resultDiv = document.getElementById('result');
            
            if (input === '' || input < 2) {
                resultDiv.style.display = 'none';
                alert('Vui lòng nhập một số lớn hơn hoặc bằng 2!');
                return;
            }
            
            const number = parseInt(input);
            const isPrime = kiem_tra_so_nguyen_to(number);
            
            if (isPrime) {
                resultDiv.className = 'result prime';
                resultDiv.textContent = `✓ ${number} là số nguyên tố!`;
            } else {
                resultDiv.className = 'result not-prime';
                resultDiv.textContent = `✗ ${number} không phải là số nguyên tố.`;
            }
            
            resultDiv.style.display = 'block';
        }
        
        // Cho phép kiểm tra bằng cách nhấn Enter
        document.getElementById('numberInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkPrime();
            }
        });
    </script>
</body>
</html>
