<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Timezones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        label {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        select, input[type="checkbox"] {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            background: white;
            color: #333;
        }
        
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #667eea;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .clock-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .clock-card:hover {
            transform: translateY(-5px);
        }
        
        .city-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .timezone-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }
        
        .clock-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .digital-time {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .time-period {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .date-display {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        
        .analog-clock {
            width: 150px;
            height: 150px;
            border: 8px solid #667eea;
            border-radius: 50%;
            position: relative;
            margin: 0 auto 15px;
            background: white;
        }
        
        .center-dot {
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .hand {
            position: absolute;
            background: #667eea;
            transform-origin: bottom center;
            left: 50%;
            bottom: 50%;
        }
        
        .hour-hand {
            width: 6px;
            height: 45px;
            margin-left: -3px;
            background: #333;
        }
        
        .minute-hand {
            width: 4px;
            height: 55px;
            margin-left: -2px;
            background: #667eea;
        }
        
        .second-hand {
            width: 2px;
            height: 60px;
            margin-left: -1px;
            background: #e74c3c;
        }
        
        .add-timezone-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .add-timezone-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"], select {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
        }
        
        .btn-remove {
            background: #e74c3c;
            padding: 5px 12px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .btn-remove:hover {
            background: #c0392b;
        }
        
        @media (max-width: 768px) {
            .digital-time {
                font-size: 36px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .control-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Digital Clock - Multiple Timezones</h1>
            <p>Track time across different cities around the world</p>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="formatToggle">12-Hour Format:</label>
                <label class="switch">
                    <input type="checkbox" id="formatToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="control-group">
                <label for="showAnalog">Show Analog Clock:</label>
                <label class="switch">
                    <input type="checkbox" id="showAnalog" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be generated here -->
        </div>
        
        <div class="add-timezone-section">
            <h3>➕ Add Custom Timezone</h3>
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Enter city name">
                <select id="timezoneSelect">
                    <option value="">Select timezone...</option>
                </select>
                <button class="btn" onclick="addCustomTimezone()">Add</button>
            </div>
        </div>
    </div>

    <script>
        // Default timezones
        const defaultTimezones = [
            { city: 'New York', timezone: 'America/New_York' },
            { city: 'London', timezone: 'Europe/London' },
            { city: 'Tokyo', timezone: 'Asia/Tokyo' },
            { city: 'Sydney', timezone: 'Australia/Sydney' },
            { city: 'Dubai', timezone: 'Asia/Dubai' },
            { city: 'Singapore', timezone: 'Asia/Singapore' },
            { city: 'Hong Kong', timezone: 'Asia/Hong_Kong' },
            { city: 'Mumbai', timezone: 'Asia/Kolkata' }
        ];
        
        // Common timezones for dropdown
        const commonTimezones = [
            'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
            'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Moscow',
            'Asia/Dubai', 'Asia/Kolkata', 'Asia/Bangkok', 'Asia/Hong_Kong',
            'Asia/Shanghai', 'Asia/Tokyo', 'Asia/Seoul', 'Australia/Sydney',
            'Australia/Melbourne', 'Pacific/Auckland', 'Pacific/Fiji', 'UTC'
        ];
        
        let customTimezones = [...defaultTimezones];
        
        // Initialize timezone dropdown
        function initTimezoneDropdown() {
            const select = document.getElementById('timezoneSelect');
            commonTimezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                option.textContent = tz;
                select.appendChild(option);
            });
        }
        
        // Update all clocks
        function updateClocks() {
            const use12Hour = document.getElementById('formatToggle').checked;
            const showAnalog = document.getElementById('showAnalog').checked;
            
            customTimezones.forEach((item, index) => {
                updateClock(item, index, use12Hour, showAnalog);
            });
        }
        
        // Update individual clock
        function updateClock(item, index, use12Hour, showAnalog) {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: item.timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: use12Hour
                });
                
                const timeString = formatter.format(now);
                const dateFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: item.timezone,
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    weekday: 'short'
                });
                const dateString = dateFormatter.format(now);
                
                // Parse time for analog clock
                const parts = timeString.match(/(\d+):(\d+):(\d+)\s*(AM|PM)?/);
                let hours = parseInt(parts[1]);
                const minutes = parseInt(parts[2]);
                const seconds = parseInt(parts[3]);
                
                if (!use12Hour) {
                    // Already in 24-hour format
                } else if (parts[4] === 'PM' && hours !== 12) {
                    hours += 12;
                } else if (parts[4] === 'AM' && hours === 12) {
                    hours = 0;
                }
                
                // Update or create clock card
                let card = document.getElementById(`clock-${index}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `clock-${index}`;
                    card.className = 'clock-card';
                    document.getElementById('clocksGrid').appendChild(card);
                }
                
                let html = `
                    <div class="city-name">${item.city}</div>
                    <div class="timezone-label">${item.timezone}</div>
                `;
                
                if (showAnalog) {
                    html += `
                        <div class="analog-clock" id="analog-${index}">
                            <div class="hand hour-hand" id="hour-${index}"></div>
                            <div class="hand minute-hand" id="minute-${index}"></div>
                            <div class="hand second-hand" id="second-${index}"></div>
                            <div class="center-dot"></div>
                        </div>
                    `;
                }
                
                html += `
                    <div class="clock-display">
                        <div class="digital-time">${timeString}</div>
                        <div class="date-display">${dateString}</div>
                    </div>
                `;
                
                if (customTimezones.length > defaultTimezones.length || index >= defaultTimezones.length) {
                    html += `<button class="btn btn-remove" onclick="removeTimezone(${index})">Remove</button>`;
                }
                
                card.innerHTML = html;
                
                // Update analog clock hands
                if (showAnalog) {
                    const hourHand = document.getElementById(`hour-${index}`);
                    const minuteHand = document.getElementById(`minute-${index}`);
                    const secondHand = document.getElementById(`second-${index}`);
                    
                    const hourDegrees = (hours % 12) * 30 + minutes * 0.5;
                    const minuteDegrees = minutes * 6 + seconds * 0.1;
                    const secondDegrees = seconds * 6;
                    
                    hourHand.style.transform = `rotate(${hourDegrees}deg)`;
                    minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
                    secondHand.style.transform = `rotate(${secondDegrees}deg)`;
                }
                
            } catch (error) {
                console.error(`Error updating clock for ${item.city}:`, error);
            }
        }
        
        // Add custom timezone
        function addCustomTimezone() {
            const cityInput = document.getElementById('cityInput');
            const timezoneSelect = document.getElementById('timezoneSelect');
            
            const city = cityInput.value.trim();
            const timezone = timezoneSelect.value;
            
            if (!city || !timezone) {
                alert('Please enter both city name and timezone');
                return;
            }
            
            // Check if already exists
            if (customTimezones.some(item => item.timezone === timezone)) {
                alert('This timezone is already added');
                return;
            }
            
            customTimezones.push({ city, timezone });
            cityInput.value = '';
            timezoneSelect.value = '';
            updateClocks();
        }
        
        // Remove timezone
        function removeTimezone(index) {
            if (index < defaultTimezones.length) {
                alert('Cannot remove default timezones');
                return;
            }
            customTimezones.splice(index, 1);
            document.getElementById(`clock-${index}`).remove();
            updateClocks();
        }
        
        // Toggle event listeners
        document.getElementById('formatToggle').addEventListener('change', updateClocks);
        document.getElementById('showAnalog').addEventListener('change', updateClocks);
        
        // Allow Enter key to add timezone
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addCustomTimezone();
        });
        
        // Initialize
        initTimezoneDropdown();
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
